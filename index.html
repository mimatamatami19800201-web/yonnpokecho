<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>よんぽけ帳</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --paper:#EFEAE1;
    --paper-deep:#E6DFD1;
    --ink:#2B3A44;
    --ink-soft:#5B6B72;
    --line:#C9BFA9;
    --wallet:#6B7F5E;
    --bank:#3F6C7A;
    --points:#A87F2E;
    --card:#8B5040;
    --danger:#A83B32;
    --danger-soft:#F1D9D3;
    --safe:#4F7A52;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    margin:0;
    padding:0;
    height:100%;
    background:#1c2126;
  }

  body{
    font-family:'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    min-height:100vh;
  }

  h1,h2,h3{
    font-family:'Shippori Mincho', serif;
    margin:0;
    font-weight:700;
  }

  /* ---- phone shell ---- */

  .phone-shell{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }

  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 18px 12px;
    border-bottom:2px solid var(--ink);
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:5;
  }

  .topbar h1{
    font-size:21px;
    letter-spacing:0.03em;
  }

  .topbar .date{
    font-size:12px;
    color:var(--ink-soft);
  }

  main{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 100px);
  }

  .tab-panel{
    display:none;
  }

  .tab-panel.active{
    display:block;
  }

  /* ---- home: gauge ---- */

  .gauge-block{
    margin-bottom:22px;
  }

  .gauge-label{
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:2px;
  }

  .gauge-figure{
    display:flex;
    align-items:flex-end;
    gap:8px;
    margin-bottom:12px;
  }

  .gauge-figure .amt{
    font-family:'Shippori Mincho', serif;
    font-size:42px;
    font-weight:700;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }

  .gauge-figure .unit{
    font-size:14px;
    color:var(--ink-soft);
    padding-bottom:6px;
  }

  .gauge-figure.over .amt{
    color:var(--danger);
  }

  .gauge-track{
    position:relative;
    height:10px;
    background:var(--paper-deep);
    border:1px solid var(--line);
    overflow:hidden;
  }

  .gauge-fill{
    position:absolute;
    top:0;
    left:0;
    bottom:0;
    background:var(--safe);
    transition:width .35s ease, background .35s ease;
    width:0%;
  }

  .gauge-fill.warn{
    background:#B08A2E;
  }

  .gauge-fill.danger{
    background:var(--danger);
  }

  .gauge-sub{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  .budget-edit{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:6px;
    text-decoration:underline;
    cursor:pointer;
    display:inline-block;
  }

  /* ---- pockets ---- */

  .pockets{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-bottom:24px;
  }

  .pocket{
    background:#fff;
    border:1px solid var(--line);
    border-left:5px solid var(--wallet);
    padding:10px 12px;
  }

  .pocket.bank{
    border-left-color:var(--bank);
  }

  .pocket.points{
    border-left-color:var(--points);
  }

  .pocket.card{
    border-left-color:var(--card);
  }

  .pocket .pname{
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }

  .pocket .pbal{
    font-family:'Shippori Mincho', serif;
    font-size:19px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  .pocket.card .pbal{
    color:var(--card);
  }

  .pocket .pnote{
    font-size:9.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }

  .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }

  .section-head h2{
    font-size:14.5px;
  }

  .see-all{
    font-size:11.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    background:none;
    border:none;
    cursor:pointer;
    font-family:'Zen Kaku Gothic New',sans-serif;
  }

  /* ---- ledger rows ---- */

  .ledger{
    display:flex;
    flex-direction:column;
  }

  .ledger-row{
    display:grid;
    grid-template-columns:auto 1fr auto auto;
    align-items:center;
    gap:9px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }

  .ledger-row .tag{
    font-size:10px;
    padding:2px 6px;
    border:1px solid currentColor;
    white-space:nowrap;
  }

  .ledger-row .tag.wallet{
    color:var(--wallet);
  }

  .ledger-row .tag.bank{
    color:var(--bank);
  }

  .ledger-row .tag.points{
    color:var(--points);
  }

  .ledger-row .tag.card{
    color:var(--card);
  }

  .ledger-row .memo{
    color:var(--ink-soft);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .ledger-row .amount{
    font-variant-numeric:tabular-nums;
    font-weight:700;
    text-align:right;
  }

  .ledger-row .amount.income{
    color:var(--safe);
  }

  .ledger-row .amount.expense{
    color:var(--ink);
  }

  .ledger-row .del{
    border:none;
    background:none;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:11.5px;
    padding:4px;
  }

  .del:hover{
    color:var(--danger);
  }

  .empty{
    color:var(--ink-soft);
    font-size:13px;
    padding:16px 0;
    text-align:center;
  }

  /* ---- input tab ---- */

  form.entry{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-top:4px;
  }

  .row{
    display:flex;
    gap:8px;
  }

  .row > *{
    flex:1;
  }

  .toggle{
    display:flex;
    border:1px solid var(--ink);
  }

  .toggle button{
    flex:1;
    border:none;
    background:var(--paper);
    color:var(--ink);
    padding:12px 0;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:14px;
    cursor:pointer;
  }

  .toggle button.active{
    background:var(--ink);
    color:var(--paper);
  }

  .toggle button:first-child{
    border-right:1px solid var(--ink);
  }

  select,
  input[type=number],
  input[type=text],
  input[type=date]{
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:15px;
    padding:11px 10px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    width:100%;
  }

  select:focus,
  input:focus{
    outline:2px solid var(--ink);
    outline-offset:1px;
  }

  .acct-select{
    display:flex;
    gap:6px;
  }

  .acct-btn{
    flex:1;
    border:1px solid var(--line);
    background:#fff;
    padding:12px 4px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--ink-soft);
    text-align:center;
  }

  .acct-btn.active{
    border-color:var(--ink);
    color:var(--ink);
    font-weight:700;
    background:var(--paper-deep);
  }

  .submit-btn{
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:14px;
    font-size:15px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    letter-spacing:0.05em;
    cursor:pointer;
    margin-top:4px;
  }

  .submit-btn:hover{
    background:#1c272e;
  }

  .confirm-flash{
    text-align:center;
    font-size:12.5px;
    color:var(--safe);
    height:16px;
    margin-top:2px;
  }

  /* ---- history tab ---- */

  .history-day{
    border-bottom:1px solid var(--line);
  }

  .history-summary{
    width:100%;
    background:none;
    border:none;
    padding:11px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:13px;
  }

  .history-summary .hd-date{
    font-weight:700;
  }

  .history-summary .hd-total{
    font-variant-numeric:tabular-nums;
    color:var(--ink-soft);
    font-size:12px;
  }

  .history-body{
    display:none;
    padding-bottom:6px;
  }

  .history-day.open .history-body{
    display:block;
  }

  .history-day.open .caret{
    transform:rotate(90deg);
  }

  .caret{
    display:inline-block;
    margin-left:6px;
    transition:transform .2s;
    font-size:9px;
  }

  /* ---- settings tab ---- */

  .settings-block{
    margin-bottom:26px;
  }

  .init-bal-row{
    display:grid;
    grid-template-columns:88px 1fr;
    align-items:center;
    gap:8px;
    font-size:13px;
    margin-bottom:8px;
  }

  .reset-btn{
    border:1px solid var(--danger);
    color:var(--danger);
    background:none;
    padding:10px 14px;
    font-size:12.5px;
    cursor:pointer;
    width:100%;
  }

  .reset-btn:hover{
    background:var(--danger-soft);
  }

  .save-note{
    font-size:11.5px;
    color:var(--safe);
    height:14px;
    margin-top:6px;
  }

  /* ---- bottom nav ---- */

  .bottom-nav{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    background:var(--paper);
    border-top:1px solid var(--line);
    padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 8px);
    z-index:10;
  }

  .nav-btn{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    background:none;
    border:none;
    color:var(--ink-soft);
    padding:6px 0;
    cursor:pointer;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:10.5px;
  }

  .nav-btn svg{
    width:21px;
    height:21px;
    stroke:var(--ink-soft);
    fill:none;
    stroke-width:1.6;
  }

  .nav-btn.active{
    color:var(--ink);
  }

  .nav-btn.active svg{
    stroke:var(--ink);
  }

  /* ---- FAB ---- */

  .fab{
    position:absolute;
    right:18px;
    bottom:78px;
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    border:none;
    font-size:26px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
    z-index:9;
  }

  .fab:active{
    transform:scale(0.94);
  }

  /* ---- onboarding ---- */

  .onboarding-overlay{
    position:absolute;
    inset:0;
    background:var(--paper);
    z-index:50;
    display:flex;
    flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 40px) 24px 30px;
    overflow-y:auto;
  }

  .onboarding-overlay.hidden{
    display:none;
  }

  .onboarding-overlay h2{
    font-size:19px;
    line-height:1.6;
    margin-bottom:8px;
  }

  .onboarding-overlay p{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.7;
    margin:0 0 26px;
  }

  .ob-row{
    display:grid;
    grid-template-columns:70px 1fr;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }

  .ob-row .tag{
    font-size:12px;
    padding:5px 0;
    text-align:center;
    border:1px solid currentColor;
  }

  .ob-row.wallet .tag{
    color:var(--wallet);
  }

  .ob-row.bank .tag{
    color:var(--bank);
  }

  .ob-row.points .tag{
    color:var(--points);
  }

  .ob-row.card .tag{
    color:var(--card);
  }

  .ob-actions{
    margin-top:28px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .ob-skip{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
  }

  /* ---- sync status ---- */

  .sync-status{
    position:fixed;
    top:8px;
    left:50%;
    transform:translateX(-50%);
    z-index:100;
    font-size:10px;
    padding:4px 9px;
    background:rgba(43,58,68,.92);
    color:#fff;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
  }

  .sync-status.show{
    opacity:1;
  }
</style>
</head>

<body>

<div class="sync-status" id="syncStatus">同期中...</div>

<div class="phone-shell">

  <div class="topbar">
    <h1>よんぽけ帳</h1>
    <span class="date" id="todayLabel"></span>
  </div>

  <main>

    <!-- HOME -->
    <section class="tab-panel active" id="tab-home">

      <div class="gauge-block">

        <div class="gauge-label">今日、まだ使える額</div>

        <div class="gauge-figure" id="gaugeFigure">
          <span class="amt" id="remainAmt">0</span>
          <span class="unit">円</span>
        </div>

        <div class="gauge-track">
          <div class="gauge-fill" id="gaugeFill"></div>
        </div>

        <div class="gauge-sub">
          <span id="spentLabel">今日の支出 0円</span>
          <span id="budgetLabel">目標 0円</span>
        </div>

        <span class="budget-edit" id="budgetEditToggle">
          目標額を変更する
        </span>

      </div>

      <div class="pockets" id="pockets"></div>

      <div class="section-head">
        <h2>今日の記録</h2>
        <button class="see-all" data-goto="history">
          履歴を見る
        </button>
      </div>

      <div class="ledger" id="todayLedger"></div>

    </section>


    <!-- INPUT -->
    <section class="tab-panel" id="tab-input">

      <div class="section-head">
        <h2>記録する</h2>
      </div>

      <form class="entry" id="entryForm">

        <div class="row">

          <div class="toggle" id="typeToggle">

            <button
              type="button"
              data-type="expense"
              class="active">
              支出
            </button>

            <button
              type="button"
              data-type="income">
              収入
            </button>

          </div>

          <input
            type="date"
            id="entryDate"
            required />

        </div>


        <div class="acct-select" id="acctSelect">

          <button
            type="button"
            class="acct-btn active"
            data-acct="wallet">
            財布
          </button>

          <button
            type="button"
            class="acct-btn"
            data-acct="bank">
            銀行
          </button>

          <button
            type="button"
            class="acct-btn"
            data-acct="points">
            ポイント
          </button>

          <button
            type="button"
            class="acct-btn"
            data-acct="card">
            カード
          </button>

        </div>


        <input
          type="number"
          id="entryAmount"
          placeholder="金額"
          min="1"
          step="1"
          required />

        <input
          type="text"
          id="entryMemo"
          placeholder="メモ（任意）"
          maxlength="40" />

        <button
          type="submit"
          class="submit-btn">
          記録する
        </button>

        <div
          class="confirm-flash"
          id="confirmFlash">
        </div>

      </form>

    </section>


    <!-- HISTORY -->
    <section class="tab-panel" id="tab-history">

      <div class="section-head">
        <h2>今日</h2>
      </div>

      <div
        class="ledger"
        id="historyTodayLedger">
      </div>

      <div
        class="section-head"
        style="margin-top:22px;">
        <h2>過去の記録</h2>
      </div>

      <div id="historyList"></div>

    </section>


    <!-- SETTINGS -->
    <section class="tab-panel" id="tab-settings">

      <div class="section-head">
        <h2>設定</h2>
      </div>


      <div class="settings-block">

        <div class="gauge-label">
          一日の目標支出額
        </div>

        <div
          class="row"
          style="margin-top:8px;">

          <input
            type="number"
            id="budgetInput"
            min="0"
            step="100" />

          <button
            type="button"
            class="submit-btn"
            id="saveBudgetBtn"
            style="flex:0 0 auto;padding:11px 16px;margin-top:0;">
            保存
          </button>

        </div>

      </div>


      <div class="settings-block">

        <div
          class="gauge-label"
          style="margin-bottom:10px;">
          残高を直接調整する
        </div>

        <div class="init-bal-row">
          <span>財布</span>
          <input
            type="number"
            id="balWallet"
            step="1" />
        </div>

        <div class="init-bal-row">
          <span>銀行</span>
          <input
            type="number"
            id="balBank"
            step="1" />
        </div>

        <div class="init-bal-row">
          <span>ポイント</span>
          <input
            type="number"
            id="balPoints"
            step="1" />
        </div>

        <div class="init-bal-row">
          <span>カード未払い</span>
          <input
            type="number"
            id="balCard"
            step="1" />
        </div>

        <button
          type="button"
          class="submit-btn"
          id="saveBalBtn">
          残高を保存
        </button>

      </div>


      <div
        class="save-note"
        id="saveNote">
      </div>


      <div class="settings-block">

        <div
          class="gauge-label"
          style="margin-bottom:10px;">
          データを消す
        </div>

        <button
          type="button"
          class="reset-btn"
          id="resetBtn">
          すべての記録をリセット
        </button>

      </div>

    </section>

  </main>


  <button
    class="fab"
    id="fabAdd"
    title="記録を追加">
    ＋
  </button>


  <nav class="bottom-nav">

    <button
      class="nav-btn active"
      data-tab="home">

      <svg viewBox="0 0 24 24">
        <path d="M4 11.5 12 4l8 7.5"/>
        <path d="M6 10v9h5v-5h2v5h5v-9"/>
      </svg>

      ホーム

    </button>


    <button
      class="nav-btn"
      data-tab="input">

      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5"/>
        <path d="M12 8v8M8 12h8"/>
      </svg>

      入力

    </button>


    <button
      class="nav-btn"
      data-tab="history">

      <svg viewBox="0 0 24 24">
        <rect
          x="5"
          y="3.5"
          width="14"
          height="17"
          rx="0.5"/>
        <path d="M8 8h8M8 11.5h8M8 15h5"/>
      </svg>

      履歴

    </button>


    <button
      class="nav-btn"
      data-tab="settings">

      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 3.5v2.6M12 17.9v2.6M4.9 6.9l1.9 1.9M17.2 15.2l1.9 1.9M3.5 12h2.6M17.9 12h2.6M4.9 17.1l1.9-1.9M17.2 8.8l1.9-1.9"/>
      </svg>

      設定

    </button>

  </nav>


  <!-- ONBOARDING -->

  <div
    class="onboarding-overlay hidden"
    id="onboarding">

    <h2>
      はじめまして。<br>
      まず、今の残高を教えてください。
    </h2>

    <p>
      財布・銀行・ポイント・カードそれぞれの「今の状態」を入れると、ここからの出入りを正しく計算できます。わからなければ0円のまま後で調整もできます。
    </p>


    <div class="ob-row wallet">

      <span class="tag">
        財布
      </span>

      <input
        type="number"
        id="obWallet"
        placeholder="0"
        step="1" />

    </div>


    <div class="ob-row bank">

      <span class="tag">
        銀行
      </span>

      <input
        type="number"
        id="obBank"
        placeholder="0"
        step="1" />

    </div>


    <div class="ob-row points">

      <span class="tag">
        ポイント
      </span>

      <input
        type="number"
        id="obPoints"
        placeholder="0"
        step="1" />

    </div>


    <div class="ob-row card">

      <span class="tag">
        カード未払い
      </span>

      <input
        type="number"
        id="obCard"
        placeholder="0"
        step="1" />

    </div>


    <div
      class="ob-row"
      style="grid-template-columns:70px 1fr;">

      <span
        style="font-size:12px;color:var(--ink-soft);">
        一日の目標
      </span>

      <input
        type="number"
        id="obBudget"
        placeholder="例）3000"
        step="100" />

    </div>


    <div class="ob-actions">

      <button
        type="button"
        class="submit-btn"
        id="obStart">
        はじめる
      </button>

      <button
        type="button"
        class="ob-skip"
        id="obSkip">
        後で設定する（0円ではじめる）
      </button>

    </div>

  </div>

</div>


<script>

(function(){

  /* ==================================================
     Supabase設定
     ================================================== */

  const SUPABASE_URL =
    "https://ogxpilzwyihpigpffgcq.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_P-FwI0_H9oAl7VyTG8oLoQ_651FpIYz";

  const supabase =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==================================================
     共有家計簿ID
     ================================================== */

  /*
    このIDが同じなら、
    あなたのスマホと彼女のスマホで
    同じ家計簿データを使用する。
  */

  const KAKEIBO_ID = "shared";


  /* ==================================================
     アカウント
     ================================================== */

  const ACCTS = {

    wallet:{
      label:'財布',
      class:'wallet'
    },

    bank:{
      label:'銀行',
      class:'bank'
    },

    points:{
      label:'ポイント',
      class:'points'
    },

    card:{
      label:'カード',
      class:'card'
    }

  };


  /* ==================================================
     共通関数
     ================================================== */

  const todayStr = () => {

    const d = new Date();

    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  };


  const fmtDateLabel = (dateStr) => {

    const [y,m,d] =
      dateStr.split('-').map(Number);

    const dt =
      new Date(y,m-1,d);

    const wd =
      ['日','月','火','水','木','金','土'][dt.getDay()];

    return `${m}月${d}日（${wd}）`;

  };


  const yen = (n) =>
    (n < 0 ? '-' : '') +
    Math.abs(Math.round(n))
      .toLocaleString('ja-JP');


  /* ==================================================
     State
     ================================================== */

  let state = {

    settings:{
      dailyBudget:3000
    },

    accounts:{
      wallet:0,
      bank:0,
      points:0,
      card:0
    },

    transactions:[],

    onboarded:false

  };


  let formType = 'expense';
  let formAcct = 'wallet';


  /* ==================================================
     同期表示
     ================================================== */

  function showSyncStatus(message){

    const el =
      document.getElementById('syncStatus');

    el.textContent = message;

    el.classList.add('show');

    setTimeout(()=>{

      el.classList.remove('show');

    },1200);

  }


  /* ==================================================
     Supabaseから読み込み
     ================================================== */

  async function loadAll(){

    showSyncStatus('読み込み中...');

    try{

      const {
        data,
        error
      } = await supabase

        .from('kakeibo_state')

        .select('data')

        .eq('id',KAKEIBO_ID)

        .maybeSingle();


      if(error){

        console.error(
          'Supabase読み込みエラー:',
          error
        );

        showSyncStatus('読み込みエラー');

        return;

      }


      /* ---------------------------------------------
         Supabaseに既存データがある
         --------------------------------------------- */

      if(data && data.data){

        const remote =
          data.data;


        state.settings =
          remote.settings || {
            dailyBudget:3000
          };


        state.accounts =
          remote.accounts || {
            wallet:0,
            bank:0,
            points:0,
            card:0
          };


        state.transactions =
          Array.isArray(remote.transactions)
            ? remote.transactions
            : [];


        state.onboarded =
          !!remote.onboarded;


        showSyncStatus('同期しました');

        return;

      }


      /* ---------------------------------------------
         Supabaseが空の場合
         ↓
         既存localStorageから一度だけ移行
         --------------------------------------------- */

      let localState = {

        settings:{
          dailyBudget:3000
        },

        accounts:{
          wallet:0,
          bank:0,
          points:0,
          card:0
        },

        transactions:[],

        onboarded:false

      };


      try{

        const v =
          localStorage.getItem(
            'kakeibo:settings'
          );

        if(v)
          localState.settings =
            JSON.parse(v);

      }catch(e){}


      try{

        const v =
          localStorage.getItem(
            'kakeibo:accounts'
          );

        if(v)
          localState.accounts =
            JSON.parse(v);

      }catch(e){}


      try{

        const v =
          localStorage.getItem(
            'kakeibo:transactions'
          );

        if(v)
          localState.transactions =
            JSON.parse(v);

      }catch(e){}


      try{

        const v =
          localStorage.getItem(
            'kakeibo:onboarded'
          );

        if(v)
          localState.onboarded =
            JSON.parse(v);

      }catch(e){}


      state = localState;


      /*
        旧データをSupabaseへ初回移行
      */

      await saveAll();


      showSyncStatus('データを移行しました');


    }catch(e){

      console.error(
        'Supabase接続エラー:',
        e
      );

      showSyncStatus('接続エラー');

    }

  }


  /* ==================================================
     Supabaseへ保存
     ================================================== */

  async function saveAll(){

    showSyncStatus('保存中...');

    try{

      const payload = {

        id:KAKEIBO_ID,

        data:{

          settings:
            state.settings,

          accounts:
            state.accounts,

          transactions:
            state.transactions,

          onboarded:
            state.onboarded

        },

        updated_at:
          new Date().toISOString()

      };


      const {
        error
      } = await supabase

        .from('kakeibo_state')

        .upsert(
          payload,
          {
            onConflict:'id'
          }
        );


      if(error){

        console.error(
          'Supabase保存エラー:',
          error
        );

        showSyncStatus('保存エラー');

        return false;

      }


      showSyncStatus('保存しました');

      return true;


    }catch(e){

      console.error(
        'Supabase保存例外:',
        e
      );

      showSyncStatus('保存エラー');

      return false;

    }

  }


  /*
    既存コードとの互換用。
    今まで saveSettings() などを呼んでいた箇所は
    そのまま動く。
  */

  async function saveSettings(){

    return await saveAll();

  }


  async function saveAccounts(){

    return await saveAll();

  }


  async function saveTransactions(){

    return await saveAll();

  }


  async function saveOnboarded(){

    state.onboarded = true;

    return await saveAll();

  }


  /* ==================================================
     残高計算
     ================================================== */

  function getBalances(){

    const bal = {
      ...state.accounts
    };


    for(const t of state.transactions){

      if(t.account === 'card'){

        bal.card +=
          (t.type === 'expense'
            ? t.amount
            : -t.amount);

      }else{

        bal[t.account] +=
          (t.type === 'income'
            ? t.amount
            : -t.amount);

      }

    }


    return bal;

  }


  /* ==================================================
     今日の支出
     ================================================== */

  function todaysExpenseTotal(){

    const today =
      todayStr();


    return state.transactions

      .filter(
        t =>
          t.date === today &&
          t.type === 'expense'
      )

      .reduce(
        (s,t) =>
          s + t.amount,
        0
      );

  }


  /* ==================================================
     取引行
     ================================================== */

  function rowHtml(t){

    const a =
      ACCTS[t.account];


    const sign =
      t.type === 'income'
        ? '+'
        : '-';


    return `

      <div class="ledger-row">

        <span class="tag ${a.class}">
          ${a.label}
        </span>

        <span class="memo">
          ${
            t.memo
              ? escapeHtml(t.memo)
              : (
                  t.type === 'income'
                    ? '収入'
                    : '支出'
                )
          }
        </span>

        <span class="amount ${t.type}">
          ${sign}${yen(t.amount)}
        </span>

        <button
          class="del"
          data-del="${t.id}">
          削除
        </button>

      </div>

    `;

  }


  function escapeHtml(s){

    const div =
      document.createElement('div');

    div.textContent = s;

    return div.innerHTML;

  }


  /* ==================================================
     画面描画
     ================================================== */

  function render(){

    document.getElementById(
      'todayLabel'
    ).textContent =
      fmtDateLabel(todayStr());


    /* ---------------------------------------------
       gauge
       --------------------------------------------- */

    const spent =
      todaysExpenseTotal();


    const budget =
      state.settings.dailyBudget || 0;


    const remain =
      budget - spent;


    const pct =
      budget > 0
        ? Math.min(
            100,
            (spent / budget) * 100
          )
        : (
            spent > 0
              ? 100
              : 0
          );


    const fig =
      document.getElementById(
        'gaugeFigure'
      );


    const fill =
      document.getElementById(
        'gaugeFill'
      );


    document.getElementById(
      'remainAmt'
    ).textContent =
      yen(remain);


    document.getElementById(
      'spentLabel'
    ).textContent =
      `今日の支出 ${yen(spent)}円`;


    document.getElementById(
      'budgetLabel'
    ).textContent =
      `目標 ${yen(budget)}円`;


    fill.style.width =
      pct + '%';


    fill.classList.remove(
      'warn',
      'danger'
    );


    fig.classList.remove(
      'over'
    );


    if(remain < 0){

      fig.classList.add('over');

      fill.classList.add(
        'danger'
      );

    }else if(pct >= 70){

      fill.classList.add(
        'warn'
      );

    }


    /* ---------------------------------------------
       pockets
       --------------------------------------------- */

    const bal =
      getBalances();


    document.getElementById(
      'pockets'
    ).innerHTML =

      Object.keys(ACCTS)

        .map(k => {

          const a =
            ACCTS[k];


          const note =
            k === 'card'
              ? '未払い残高'
              : '';


          return `

            <div class="pocket ${a.class}">

              <div class="pname">
                ${a.label}
              </div>

              <div class="pbal">
                ${yen(bal[k])}円
              </div>

              ${
                note
                  ? `<div class="pnote">${note}</div>`
                  : ''
              }

            </div>

          `;

        })

        .join('');


    /* ---------------------------------------------
       今日の記録
       --------------------------------------------- */

    const today =
      todayStr();


    const todayTx =

      state.transactions

        .filter(
          t => t.date === today
        )

        .sort(
          (a,b) =>
            b.createdAt -
            a.createdAt
        );


    const todayHtml =

      todayTx.length

        ? todayTx
            .map(rowHtml)
            .join('')

        : `<div class="empty">
             まだ記録がありません
           </div>`;


    document.getElementById(
      'todayLedger'
    ).innerHTML =
      todayHtml;


    document.getElementById(
      'historyTodayLedger'
    ).innerHTML =
      todayHtml;


    /* ---------------------------------------------
       履歴
       --------------------------------------------- */

    const dates =

      [
        ...new Set(

          state.transactions

            .filter(
              t => t.date !== today
            )

            .map(
              t => t.date
            )

        )
      ]

      .sort(
        (a,b) =>
          b.localeCompare(a)
      );


    const historyList =
      document.getElementById(
        'historyList'
      );


    if(dates.length === 0){

      historyList.innerHTML =
        `<div class="empty">
           過去の記録はまだありません
         </div>`;

    }else{

      historyList.innerHTML =

        dates

          .map(d => {

            const txs =

              state.transactions

                .filter(
                  t => t.date === d
                )

                .sort(
                  (a,b) =>
                    b.createdAt -
                    a.createdAt
                );


            const dayExpense =

              txs

                .filter(
                  t => t.type === 'expense'
                )

                .reduce(
                  (s,t) =>
                    s + t.amount,
                  0
                );


            const dayIncome =

              txs

                .filter(
                  t => t.type === 'income'
                )

                .reduce(
                  (s,t) =>
                    s + t.amount,
                  0
                );


            return `

              <div
                class="history-day"
                data-date="${d}">

                <button
                  class="history-summary"
                  data-toggle="${d}">

                  <span class="hd-date">

                    ${fmtDateLabel(d)}

                    <span class="caret">
                      ▶
                    </span>

                  </span>

                  <span class="hd-total">

                    支出 ${yen(dayExpense)}
                    /
                    収入 ${yen(dayIncome)}

                  </span>

                </button>


                <div
                  class="history-body ledger">

                  ${
                    txs
                      .map(rowHtml)
                      .join('')
                  }

                </div>

              </div>

            `;

          })

          .join('');

    }


    bindDynamicHandlers();


    /* ---------------------------------------------
       設定画面
       --------------------------------------------- */

    document.getElementById(
      'budgetInput'
    ).value =
      state.settings.dailyBudget || 0;


    document.getElementById(
      'balWallet'
    ).value =
      state.accounts.wallet || 0;


    document.getElementById(
      'balBank'
    ).value =
      state.accounts.bank || 0;


    document.getElementById(
      'balPoints'
    ).value =
      state.accounts.points || 0;


    document.getElementById(
      'balCard'
    ).value =
      state.accounts.card || 0;

  }


  /* ==================================================
     動的イベント
     ================================================== */

  function bindDynamicHandlers(){

    document
      .querySelectorAll('[data-del]')
      .forEach(btn => {

        btn.onclick = async () => {

          const id =
            btn.getAttribute(
              'data-del'
            );


          state.transactions =

            state.transactions.filter(
              t =>
                String(t.id) !== id
            );


          await saveTransactions();


          render();

        };

      });


    document
      .querySelectorAll('[data-toggle]')
      .forEach(btn => {

        btn.onclick = () => {

          btn
            .closest('.history-day')
            .classList
            .toggle('open');

        };

      });

  }


  /* ==================================================
     タブ移動
     ================================================== */

  function goToTab(name){

    document
      .querySelectorAll('.tab-panel')
      .forEach(p => {

        p.classList.toggle(
          'active',
          p.id === 'tab-' + name
        );

      });


    document
      .querySelectorAll('.nav-btn')
      .forEach(b => {

        b.classList.toggle(

          'active',

          b.getAttribute(
            'data-tab'
          ) === name

        );

      });


    document.querySelector(
      'main'
    ).scrollTop = 0;


    document.getElementById(
      'fabAdd'
    ).style.display =
      name === 'home'
        ? 'flex'
        : 'none';

  }


  document
    .querySelectorAll('.nav-btn')
    .forEach(btn => {

      btn.addEventListener(
        'click',
        () =>
          goToTab(
            btn.getAttribute(
              'data-tab'
            )
          )
      );

    });


  document
    .querySelectorAll('[data-goto]')
    .forEach(btn => {

      btn.addEventListener(
        'click',
        () =>
          goToTab(
            btn.getAttribute(
              'data-goto'
            )
          )
      );

    });


  document
    .getElementById('fabAdd')
    .addEventListener(
      'click',
      () =>
        goToTab('input')
    );


  /* ==================================================
     入力フォーム
     ================================================== */

  document.getElementById(
    'entryDate'
  ).value =
    todayStr();


  document.getElementById(
    'typeToggle'
  ).addEventListener(
    'click',
    e => {

      const btn =
        e.target.closest(
          'button'
        );


      if(!btn) return;


      formType =
        btn.getAttribute(
          'data-type'
        );


      document
        .querySelectorAll(
          '#typeToggle button'
        )
        .forEach(
          b =>
            b.classList.toggle(
              'active',
              b === btn
            )
        );

    }
  );


  document.getElementById(
    'acctSelect'
  ).addEventListener(
    'click',
    e => {

      const btn =
        e.target.closest(
          'button'
        );


      if(!btn) return;


      formAcct =
        btn.getAttribute(
          'data-acct'
        );


      document
        .querySelectorAll(
          '#acctSelect .acct-btn'
        )
        .forEach(
          b =>
            b.classList.toggle(
              'active',
              b === btn
            )
        );

    }
  );


  document.getElementById(
    'entryForm'
  ).addEventListener(
    'submit',
    async e => {

      e.preventDefault();


      const amount =
        Number(
          document.getElementById(
            'entryAmount'
          ).value
        );


      const date =
        document.getElementById(
          'entryDate'
        ).value ||
        todayStr();


      const memo =
        document.getElementById(
          'entryMemo'
        ).value.trim();


      if(!amount || amount <= 0)
        return;


      state.transactions.push({

        id:
          Date.now() +
          Math.random(),

        date,

        type:
          formType,

        account:
          formAcct,

        amount,

        memo,

        createdAt:
          Date.now()

      });


      const saved =
        await saveTransactions();


      if(!saved)
        return;


      document.getElementById(
        'entryAmount'
      ).value = '';


      document.getElementById(
        'entryMemo'
      ).value = '';


      render();


      const flash =
        document.getElementById(
          'confirmFlash'
        );


      flash.textContent =
        '記録しました';


      setTimeout(() => {

        if(
          flash.textContent ===
          '記録しました'
        ){

          flash.textContent = '';

        }

      },1600);

    }
  );


  /* ==================================================
     設定
     ================================================== */

  document.getElementById(
    'budgetEditToggle'
  ).addEventListener(
    'click',
    () => {

      goToTab('settings');

      document.getElementById(
        'budgetInput'
      ).focus();

    }
  );


  document.getElementById(
    'saveBudgetBtn'
  ).addEventListener(
    'click',
    async () => {

      state.settings.dailyBudget =

        Number(
          document.getElementById(
            'budgetInput'
          ).value
        ) || 0;


      const saved =
        await saveSettings();


      if(saved){

        flashNote(
          '目標額を保存しました'
        );

        render();

      }

    }
  );


  document.getElementById(
    'saveBalBtn'
  ).addEventListener(
    'click',
    async () => {

      state.accounts = {

        wallet:
          Number(
            document.getElementById(
              'balWallet'
            ).value
          ) || 0,

        bank:
          Number(
            document.getElementById(
              'balBank'
            ).value
          ) || 0,

        points:
          Number(
            document.getElementById(
              'balPoints'
            ).value
          ) || 0,

        card:
          Number(
            document.getElementById(
              'balCard'
            ).value
          ) || 0

      };


      const saved =
        await saveAccounts();


      if(saved){

        flashNote(
          '残高を保存しました'
        );

        render();

      }

    }
  );


  /* ==================================================
     全データリセット
     ================================================== */

  document.getElementById(
    'resetBtn'
  ).addEventListener(
    'click',
    async () => {

      if(
        !confirm(
          'すべての記録・残高・設定を削除します。よろしいですか？'
        )
      )
        return;


      state = {

        settings:{
          dailyBudget:3000
        },

        accounts:{
          wallet:0,
          bank:0,
          points:0,
          card:0
        },

        transactions:[],

        onboarded:true

      };


      const saved =
        await saveAll();


      if(saved){

        flashNote(
          'データをリセットしました'
        );

        render();

      }

    }
  );


  function flashNote(msg){

    const n =
      document.getElementById(
        'saveNote'
      );


    n.textContent =
      msg;


    setTimeout(() => {

      if(
        n.textContent === msg
      ){

        n.textContent = '';

      }

    },2000);

  }


  /* ==================================================
     初回設定
     ================================================== */

  document.getElementById(
    'obStart'
  ).addEventListener(
    'click',
    async () => {

      state.accounts = {

        wallet:
          Number(
            document.getElementById(
              'obWallet'
            ).value
          ) || 0,

        bank:
          Number(
            document.getElementById(
              'obBank'
            ).value
          ) || 0,

        points:
          Number(
            document.getElementById(
              'obPoints'
            ).value
          ) || 0,

        card:
          Number(
            document.getElementById(
              'obCard'
            ).value
          ) || 0

      };


      const b =
        Number(
          document.getElementById(
            'obBudget'
          ).value
        );


      if(b)
        state.settings.dailyBudget =
          b;


      state.onboarded =
        true;


      const saved =
        await saveAll();


      if(!saved)
        return;


      document.getElementById(
        'onboarding'
      ).classList.add(
        'hidden'
      );


      render();

    }
  );


  document.getElementById(
    'obSkip'
  ).addEventListener(
    'click',
    async () => {

      state.onboarded =
        true;


      const saved =
        await saveAll();


      if(!saved)
        return;


      document.getElementById(
        'onboarding'
      ).classList.add(
        'hidden'
      );


      render();

    }
  );


  /* ==================================================
     起動
     ================================================== */

  (async function init(){

    await loadAll();


    if(!state.onboarded){

      document.getElementById(
        'onboarding'
      ).classList.remove(
        'hidden'
      );

    }


    render();


    /*
      初回表示後、
      Supabaseから最新データを
      再取得して画面を更新
    */

    setTimeout(
      async () => {

        await loadAll();

        render();

      },
      1000
    );

  })();

})();

</script>

</body>
</html>
